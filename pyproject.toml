[tool.poetry]
name = "multilingual-mechinterp"
version = "0.1.0"
description = "Mechanistic interpretability toolkit for multilingual LLM analysis (SAE, JLens, activation patching)."
authors = ["Arash <arashlove@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "multilingual_mechinterp", from = "src" }]
keywords = ["mechanistic-interpretability", "sae", "jlens", "activation-patching", "multilingual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.1.0"
transformers = ">=4.40.0"
numpy = ">=1.24.0"
pyyaml = ">=6.0"
tqdm = ">=4.66.0"
einops = ">=0.7.0"
datasets = ">=2.14.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
ipykernel = ">=6.29.0"
jupyter = ">=1.0.0"
matplotlib = ">=3.8.0"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
